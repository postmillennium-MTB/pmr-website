<!DOCTYPE html>

  <style>
    :root {
      --bg:         #ECEAE4;
      --text:       #1A1814;
      --text-muted: #5C574E;
      --bg-rule:    #CECCCA;
      --accent:     #7A3828;
      --blue:       #3A5C6E;
      --castle-fill:#2E2416;
      --ff-display: 'Audiowide', 'Space Grotesk', sans-serif;
      --ff-sans:  'Space Grotesk', sans-serif;
      --ff-body:  'Inter', sans-serif;
      --ff-mono:  'Space Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--ff-body);
      display: flex; flex-direction: column;
    }

    nav {
      max-width: 1200px; margin: 0 auto; width: 100%;
      padding: 1.5rem 2.5rem; display: flex; align-items: center;
    }
    .nav-logo { display: flex; align-items: center; gap: 0.625rem; text-decoration: none; color: var(--text); }
    .nav-mark { height: 26px; width: auto; display: block; }
    .nav-mark .castle-fill { fill: var(--castle-fill); }
    .nav-wordmark {
      font-family: var(--ff-sans); font-weight: 700; font-size: 0.875rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--text);
    }
    .nav-wordmark em { color: var(--accent); font-style: normal; }

    main {
      flex: 1; display: flex; align-items: center;
      max-width: 640px; margin: 0 auto; padding: 2rem 2.5rem 4rem;
      text-align: center;
    }
    .content { width: 100%; }

    .eyebrow {
      font-family: var(--ff-mono); font-size: 0.72rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1.25rem;
    }
    h1 {
      font-family: var(--ff-display); font-weight: 400; text-transform: uppercase;
      letter-spacing: 0.01em;
      font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.35;
      margin-bottom: 1rem;
    }
    .desc {
      font-size: 1rem; color: var(--text-muted); line-height: 1.7;
      max-width: 42ch; margin: 0 auto 2.5rem;
    }

    .actions { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .home-cta {
      display: inline-flex; align-items: center; gap: 0.6rem;
      background: var(--accent); color: #fff;
      font-family: var(--ff-mono); font-size: 0.72rem; letter-spacing: 0.16em;
      text-transform: uppercase; padding: 0.875rem 1.75rem; text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .home-cta:hover { background: var(--blue); transform: translateY(-1px); }
    .home-cta svg { transition: transform 0.2s; }
    .home-cta:hover svg { transform: translateX(4px); }

    .secondary-links {
      display: flex; gap: 1.75rem; flex-wrap: wrap; justify-content: center;
    }
    .secondary-links a {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em;
      color: var(--text-muted); text-decoration: none;
      border-bottom: 1px solid var(--bg-rule); padding-bottom: 0.15rem;
      transition: color 0.2s, border-color 0.2s;
    }
    .secondary-links a:hover { color: var(--accent); border-color: var(--accent); }

    footer {
      max-width: 1200px; margin: 0 auto; width: 100%;
      padding: 1.5rem 2.5rem 2rem; text-align: center;
      border-top: 1px solid var(--bg-rule);
    }
    .footer-meta {
      font-family: var(--ff-mono); font-size: 0.66rem; color: var(--text-muted);
      letter-spacing: 0.08em;
    }
    .footer-meta a { color: var(--text-muted); }

    @media (max-width: 520px) {
      nav, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    }
  </style>
</head>
