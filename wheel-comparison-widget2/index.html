<!DOCTYPE html>

<head>

  <title>Wheel Strength Comparison Tool — Post Millennium Renaissance</title>
  <meta name="description" content="Compares wheels built with 148×12 vs. 157×12 hubs using Matt Ford&#x27;s academic research.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://postmillenniumrenaissance.com/wheel-comparison-widget2/">
  <meta property="og:title" content="Wheel Strength Comparison Tool — Post Millennium Renaissance">
  <meta property="og:description" content="Compares wheels built with 148×12 vs. 157×12 hubs using Matt Ford&#x27;s academic research.">
  <meta property="og:image" content="https://postmillenniumrenaissance.com/og-image.jpg">

  <meta name="twitter:title" content="Wheel Strength Comparison Tool — Post Millennium Renaissance">
  <meta name="twitter:description" content="Compares wheels built with 148×12 vs. 157×12 hubs using Matt Ford&#x27;s academic research.">
  <meta name="twitter:image" content="https://postmillenniumrenaissance.com/og-image.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1C1A14; }
    iframe { display: block; width: 100%; height: 100vh; border: none; }
  </style>
</head>
<body>
  <iframe src="https://postmillennium-mtb.github.io/wheel-comparison-widget2/" title="Wheel Strength Comparison Tool" allow="clipboard-write; web-share" allowfullscreen></iframe>
  <script>
    document.querySelectorAll('iframe[src*="postmillennium-mtb.github.io"]').forEach(f => {
      if (window.location.hash) f.src += window.location.hash;
    });
    // The widget keeps its settings in its own URL hash, inside the iframe.
    // It posts that hash here as it changes, so this page's address bar is
    // always a link to the build on screen. Only the widget's origin is
    // listened to, and only a plain hash string is accepted.
    window.addEventListener('message', e => {
      if (e.origin !== 'https://postmillennium-mtb.github.io') return;
      const d = e.data;
      if (!d || d.type !== 'pmr-build-hash' || typeof d.hash !== 'string') return;
      if (!/^#[\w.=&%-]{0,600}$/.test(d.hash)) return;
      try { history.replaceState(null, '', d.hash); } catch (err) {}
    });
    // "My wheel": the widget's one saved build (wheel-physics-core's
    // js/my-wheel.js). The Wheel Strength Lab runs on this site's origin and
    // keeps it in this origin's localStorage; the widget, framed from
    // github.io, cannot see that storage, so it asks this page to read and
    // write it. Only the widget frame on its own origin is answered, and only
    // a well-formed build is stored: the five build fields, each checked
    // against the values the tools offer, rewritten into a fresh record (any
    // other field is dropped). Both tools validate it again when they read
    // it. Nothing leaves the browser.
    const MY_WHEEL_KEY = 'pmr-my-wheel';
    function cleanMyWheel(text) {
      if (typeof text !== 'string' || text.length > 400) return null;
      let b;
      try { const r = JSON.parse(text); b = r && r.v === 1 ? r.build : null; } catch (err) { return null; }
      if (!b || typeof b !== 'object') return null;
      const t = Number(b.tension);
      if (!/^h\d{1,3}$/.test(b.hub) || ['148', '157'].indexOf(b.std) < 0 ||
          ['26', '27.5', '29', '32'].indexOf(b.wheel) < 0 || ['28', '32', '36'].indexOf(b.spokes) < 0 ||
          !isFinite(t) || t < 80 || t > 125) return null;
      return JSON.stringify({ v: 1, build: { hub: b.hub, std: b.std, wheel: b.wheel, tension: t, spokes: b.spokes } });
    }
    window.addEventListener('message', e => {
      const frame = document.querySelector('iframe');
      if (e.origin !== 'https://postmillennium-mtb.github.io' || !frame || e.source !== frame.contentWindow) return;
      const d = e.data;
      if (!d || typeof d.type !== 'string' || d.type.indexOf('pmr-my-wheel-') !== 0) return;
      let value = null;
      try {
        if (d.type === 'pmr-my-wheel-set') {
          const clean = cleanMyWheel(d.value);
          if (clean) localStorage.setItem(MY_WHEEL_KEY, clean);
        } else if (d.type === 'pmr-my-wheel-clear') {
          localStorage.removeItem(MY_WHEEL_KEY);
        }
        value = cleanMyWheel(localStorage.getItem(MY_WHEEL_KEY));
      } catch (err) {}
      frame.contentWindow.postMessage({ type: 'pmr-my-wheel', value: value }, e.origin);
    });
  </script>
</body>
</html>
