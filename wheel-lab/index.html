@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap');
.hs{
  --bg:#f5f6f4; --panel:#ffffff; --fg:#1d2321; --muted:#5a6461; --rule:#d5dad7;
  --accent:#1f5c73; --chip148:#1f5c73; --chip157-fg:#7a3b00; --chip157-bg:#fbe9d6; --hl:#eef3f5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  position:relative; left:50%; transform:translateX(-50%);
  width:min(1240px, calc(100vw - 32px));
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.5;
  border:1px solid var(--rule); border-radius:4px;
  padding:28px clamp(14px,2.5vw,28px) 32px; display:grid; gap:24px; text-align:left;
}
@media (prefers-color-scheme: dark){.hs{--bg:#141918;--panel:#1c2220;--fg:#e4e8e6;--muted:#9aa5a1;--rule:#2f3735;--accent:#7cc0d8;--chip148:#7cc0d8;--chip157-fg:#ffcf9e;--chip157-bg:#4a2a0c;--hl:#1f2a2d;color-scheme:dark}}
.hs *{box-sizing:border-box}
.hs header{display:grid;gap:8px;border-bottom:2px solid var(--fg);padding-bottom:14px}
.hs .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hs h1{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance;font-weight:700}
.hs .lede{max-width:68ch;margin:0;color:var(--muted)}
.hs .top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:820px){.hs .top{grid-template-columns:minmax(0,1fr)}}
.hs .facts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hs .facts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.hs .facts b{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--accent);min-width:3.5em}
.hs figure{margin:0;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px}
.hs figure svg{width:100%;height:auto;display:block}
.hs figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.hs .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hs .controls button{font:500 13px var(--body);padding:6px 12px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:3px;cursor:pointer}
.hs .controls button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.hs .controls button:focus-visible,.hs th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hs .controls .hint{font-size:12px;color:var(--muted);margin-left:auto}
.hs .tablebox{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px}
.hs table{border-collapse:collapse;width:100%;min-width:1080px;font-variant-numeric:tabular-nums}
.hs th,.hs td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.hs th{font:600 11.5px/1.25 var(--body);color:var(--muted);vertical-align:bottom;background:var(--panel);white-space:normal}
.hs th button{all:unset;cursor:pointer;display:block}
.hs th[aria-sort] button::after{content:" \u2195";opacity:.4}
.hs th[aria-sort="ascending"] button::after{content:" \u2191";opacity:1}
.hs th[aria-sort="descending"] button::after{content:" \u2193";opacity:1}
.hs th.grp{text-align:center;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--fg)}
.hs td{font-family:var(--mono);font-size:13.5px}
.hs td.l,.hs th.l{text-align:left}
.hs td.name{font-family:var(--body);font-weight:500;font-size:14px}
.hs td.id{color:var(--muted);font-size:12px}
.hs td.src{font-family:var(--body);font-size:12.5px;color:var(--muted);white-space:normal;min-width:180px;text-align:left}
.hs td.key{font-weight:500}
.hs tbody tr:hover{background:var(--hl)}
.hs .chip{display:inline-block;font:500 12px var(--mono);padding:1px 7px;border-radius:2px}
.hs .c148{color:var(--panel);background:var(--chip148)}
.hs .c157{color:var(--chip157-fg);background:var(--chip157-bg);border:1px solid var(--chip157-fg)}
.hs .none{color:var(--muted)}
.hs .sep td{border-top:2px solid var(--fg)}
.hs .notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.hs .notes section{min-width:0}
.hs h2{font-family:var(--display);font-size:22px;margin:0 0 6px;letter-spacing:.01em;font-weight:700}
.hs .notes p,.hs .notes li{font-size:14px;max-width:65ch}
.hs .notes p{margin:0 0 10px}
.hs .notes ul{padding-left:18px;margin:0}
.hs code{font-family:var(--mono);font-size:.92em}
.hs .ok{font-weight:600}
.hs footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
