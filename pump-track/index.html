<body>
  <iframe src="https://postmillennium-mtb.github.io/skate-park-calc/" title="Skatepark and Pump Track ROI Calculator" allow="web-share; clipboard-write" allowfullscreen></iframe>
  <script>
    document.querySelectorAll('iframe[src*="postmillennium-mtb.github.io"]').forEach(f => {
      if (window.location.hash) f.src += window.location.hash;
    });
    // Later hash changes on this page are forwarded by postMessage; the tool checks
    // this page's origin against its allow-list before acting on it.
    window.addEventListener('hashchange', () => {
      const f = document.querySelector('iframe');
      if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'pmr-hash', hash: window.location.hash }, 'https://postmillennium-mtb.github.io');
    });
  </script>
